# Example ~/.tmux.conf fragment — extended key reporting
#
# Required for C-S-<letter> bindings (C-S-d to duplicate a line, and
# C-S-f / C-S-b / C-S-p / C-S-n shift-selection) to work in `emacs -nw`
# running inside tmux. Without this, legacy terminal encoding collapses
# C-S-d and C-d into the same byte and Emacs cannot tell them apart.
#
# This is only tmux's half. The Emacs half lives in init.el, under the
# "Kitty Keyboard Protocol" section — both halves are required.

# Ask the outer terminal for extended key events. Without the extkeys
# feature tmux never requests them, so it has nothing to forward.
# Match the terminal you actually use (xterm-ghostty here).
set -as terminal-features ',xterm-ghostty:extkeys'

# Report modified keys to programs running inside the pane.
set -s extended-keys on

# csi-u, not xterm. Emacs decodes these with kkp's parser, which
# understands the Kitty encoding: csi-u spells C-S-d as "\e[100;6u",
# while the xterm format spells it "\e[27;6;100~" and would be misread
# as keycode 27.
set -s extended-keys-format csi-u

# Debugging notes
#
# Check the negotiated mode per pane ("VT10x" = legacy, "Ext 2" = what
# these bindings need):
#
#   tmux list-panes -a -F '#{pane_current_command} #{pane_key_mode}'
#
# Capture the raw bytes of a real keypress (press the key once after
# running it). Note that `tmux send-keys C-S-d` is NOT a valid substitute:
# it synthesises code 100 ('d') while a real Ghostty keypress sends code
# 68 ('D'), so testing with it gives a false positive.
#
#   printf '\033[>4;2m'; stty raw -echo
#   dd of=/tmp/k.bin bs=1 count=12 2>/dev/null; stty sane; od -c /tmp/k.bin
